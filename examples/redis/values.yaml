image:
  repository: redis
  tag: "7.4"

workload:
  # always | on-failure | unless-stopped | never
  restartPolicy: always

service:
  # A Service named redis on the release network: how other workloads reach it.
  enabled: true
  port: 6379
  # Expose it through the host gateway on this tcp listener, which the host's administrator adds
  # (karga gateway listener add redis --port 6379 --protocol tcp). Empty: not exposed.
  listener: ""

storage:
  enabled: true

config:
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru

resources:
  memory: 512Mi
  cpu: 1
