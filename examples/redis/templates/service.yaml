{{- if .Values.service.enabled }}
# Other workloads of the release reach Redis as redis:{{ .Values.service.port }}.
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: redis
spec:
  workload: redis
  ports:
    - name: redis
      port: {{ .Values.service.port }}
  {{- with .Values.service.listener }}
  expose:
    - port: redis
      listener: {{ . }}
  {{- end }}
{{- end }}
