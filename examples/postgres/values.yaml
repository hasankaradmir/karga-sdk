image:
  repository: postgres
  tag: "17"

database:
  name: app
  user: app
  # Required. Pass it with --set database.password=... or a values file kept out of git.
  password: ""

service:
  # A Service named postgres on the release network: how other workloads reach it.
  enabled: true
  port: 5432
  # Expose it through the host gateway on this tcp listener, which the host's administrator adds
  # (karga gateway listener add postgres --port 5432 --protocol tcp). Empty: not exposed.
  listener: ""

storage:
  enabled: true

resources:
  memory: 1Gi
  cpu: 1
