{{- if .Values.service.enabled }}
# Other workloads of the release reach PostgreSQL as postgres:{{ .Values.service.port }}.
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: postgres
spec:
  workload: postgres
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
  {{- with .Values.service.listener }}
  expose:
    - port: postgres
      listener: {{ . }}
  {{- end }}
{{- end }}
