apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: postgres
spec:
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  restartPolicy: always
  environment:
    POSTGRES_DB: {{ .Values.database.name | quote }}
    POSTGRES_USER: {{ .Values.database.user | quote }}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres/password
  {{- if .Values.network.enabled }}
  networks:
    - postgres-network
  ports:
    - containerPort: 5432
      hostPort: {{ .Values.network.port }}
  {{- end }}
  mounts:
    - secret: postgres-credentials
      mountPath: /run/secrets/postgres
    {{- if .Values.storage.enabled }}
    - volume: postgres-data
      mountPath: /var/lib/postgresql/data
    {{- end }}
  healthCheck:
    type: exec
    command: [pg_isready, -U, {{ .Values.database.user | quote }}, -d, {{ .Values.database.name | quote }}]
    interval: 10s
    timeout: 5s
    retries: 5
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
