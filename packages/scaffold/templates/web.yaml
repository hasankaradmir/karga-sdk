apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: net
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  networks: [net]
  ports:
    - containerPort: 80
      {{- if .Values.route.host }}
      routes:
        - host: {{ .Values.route.host }}
      {{- else }}
      hostPort: {{ .Values.service.port }}
      hostIP: {{ .Values.service.hostIP }}
      {{- end }}
  # http: karga checks GET / itself, so the image needs no curl or wget.
  healthCheck:
    type: http
    port: 80
    path: /
    interval: 5s
    startPeriod: 10s
  resources:
    memory: {{ .Values.resources.memory }}
    cpu: {{ .Values.resources.cpu }}
  # replace starts the new version next to the old one and switches without downtime.
  updateStrategy:
    type: replace
    drainTimeout: 10s
