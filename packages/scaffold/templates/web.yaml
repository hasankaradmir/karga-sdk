apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: net
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  networks: [net]
  # Nothing is published: the Service below is the only way in.
  ports:
    - name: http
      containerPort: 80
  # http: karga checks GET / itself, so the image needs no curl or wget.
  healthCheck:
    type: http
    port: 80
    path: /
    interval: 5s
    startPeriod: 10s
  resources:
    memory: {{ .Values.resources.memory }}
    cpu: {{ .Values.resources.cpu }}
  # replace starts the new version next to the old one and switches without downtime.
  updateStrategy:
    type: replace
    drainTimeout: 10s
---
# Other workloads of the release reach the web server as web:{{ .Values.service.port }}.
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: web
spec:
  workload: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  {{- if .Values.expose.host }}
  # Served on the host gateway's listener; the host's administrator decides where it listens.
  expose:
    - port: http
      listener: {{ .Values.expose.listener }}
      host: {{ .Values.expose.host }}
  {{- end }}
