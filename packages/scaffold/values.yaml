# Image of the web server.
image:
  repository: nginx
  tag: 1.27-alpine

# The Service other workloads of the release reach the web server on, as web:<port>.
service:
  port: 80

# Expose the service on the host gateway: a listener the host's administrator defined (karga
# gateway listener list) and a host name. An empty host exposes nothing.
expose:
  listener: web
  host: ""

resources:
  memory: 128Mi
  cpu: 0.5
