---
# Source: postgres/templates/network.yaml
apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: postgres-network
---
# Source: postgres/templates/secret.yaml
apiVersion: karga.io/v1alpha1
kind: Secret
metadata:
  name: postgres-credentials
spec:
  values:
    password: <redacted>
---
# Source: postgres/templates/volume.yaml
apiVersion: karga.io/v1alpha1
kind: Volume
metadata:
  name: postgres-data
spec:
  retention: retain
---
# Source: postgres/templates/workload.yaml
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: postgres
spec:
  image: "postgres:17"
  restartPolicy: always
  environment:
    POSTGRES_DB: "app"
    POSTGRES_USER: "app"
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres/password
  networks:
    - postgres-network
  ports:
    - containerPort: 5432
      hostPort: 5432
  mounts:
    - secret: postgres-credentials
      mountPath: /run/secrets/postgres
    - volume: postgres-data
      mountPath: /var/lib/postgresql/data
  healthCheck:
    type: exec
    command: [pg_isready, -U, "app", -d, "app"]
    interval: 10s
    timeout: 5s
    retries: 5
  resources:
    cpu: 1
    memory: 1Gi
