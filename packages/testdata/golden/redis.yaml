---
# Source: redis/templates/config.yaml
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: redis-config
spec:
  files:
    redis.conf: |
      bind 0.0.0.0
      dir /data
      maxmemory 256mb
      maxmemory-policy allkeys-lru
---
# Source: redis/templates/network.yaml
apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: redis-network
spec:
  driver: bridge
---
# Source: redis/templates/volume.yaml
apiVersion: karga.io/v1alpha1
kind: Volume
metadata:
  name: redis-data
spec:
  driver: local
  retention: retain
---
# Source: redis/templates/workload.yaml
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: redis
spec:
  image: "redis:7.4"
  restartPolicy: always
  command:
    - redis-server
    - /usr/local/etc/redis/redis.conf
  networks:
    - redis-network
  ports:
    - containerPort: 6379
      hostPort: 6379
  mounts:
    - config: redis-config
      mountPath: /usr/local/etc/redis
    - volume: redis-data
      mountPath: /data
  healthCheck:
    type: exec
    command: [redis-cli, ping]
    interval: 10s
    timeout: 3s
    retries: 3
  resources:
    cpu: 1
    memory: 512Mi
