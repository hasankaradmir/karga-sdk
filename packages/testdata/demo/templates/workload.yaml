apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: {{ include "demo.name" . }}
spec:
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  ports:
    - containerPort: 80
      hostPort: {{ .Values.port }}
  mounts:
    - config: {{ include "demo.name" . }}
      mountPath: /etc/nginx/conf.d
{{- if .Values.storage.enabled }}
    - volume: {{ .Release.Name }}-data
      mountPath: /data
{{- end }}
{{- if .Values.password }}
    - secret: {{ .Release.Name }}-auth
      mountPath: /run/secrets/auth
{{- end }}
