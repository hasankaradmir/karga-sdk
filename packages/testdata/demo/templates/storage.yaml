{{- if .Values.storage.enabled }}
apiVersion: karga.io/v1alpha1
kind: Volume
metadata:
  name: {{ .Release.Name }}-data
{{- end }}
---
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: {{ include "demo.name" . }}
spec:
  files:
    default.conf: |
      {{- .Files.Get "default.conf" | nindent 6 }}
